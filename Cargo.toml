[workspace]
members = [
    "crates/tweeq-core",
    "crates/tweeq-egui",
    "crates/tweeq-demo",
    "crates/tweeq-slint",
    "crates/tweeq-slint-build",
    "crates/tweeq-slint-demo",
]
default-members = ["crates/tweeq-core", "crates/tweeq-egui", "crates/tweeq-demo"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/Aodaruma/tweeq-rs"
homepage = "https://aodaruma.github.io/tweeq-rs/"

[workspace.dependencies]
egui = { version = "0.35.0", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
tweeq-core = { path = "crates/tweeq-core", version = "=0.1.0-alpha.2" }
tweeq-egui = { path = "crates/tweeq-egui", version = "=0.1.0-alpha.2" }
tweeq-slint = { path = "crates/tweeq-slint", version = "=0.1.0-alpha.2" }
tweeq-slint-build = { path = "crates/tweeq-slint-build", version = "=0.1.0-alpha.2" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-18", "backend-winit", "renderer-femtovg"] }
slint-build = "=1.18.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
