name: CI

on:
  push:
  pull_request:

jobs:
  rust-native:
    name: Rust native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy -p tweeq-core -p tweeq-egui -p tweeq-demo --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p tweeq-core -p tweeq-egui -p tweeq-demo --all-features --locked

  msrv:
    name: MSRV 1.92.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo clippy -p tweeq-core -p tweeq-egui -p tweeq-demo --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p tweeq-core -p tweeq-egui -p tweeq-demo --all-features --locked
      - run: cargo check -p tweeq-core -p tweeq-egui -p tweeq-demo --all-features --locked --target wasm32-unknown-unknown

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc -p tweeq-core -p tweeq-egui --all-features --no-deps --locked

  rust-wasm:
    name: Rust WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p tweeq-core -p tweeq-egui -p tweeq-demo --all-features --locked --target wasm32-unknown-unknown

  slint:
    name: Slint Windows and WASM (Rust 1.92)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo clippy -p tweeq-slint -p tweeq-slint-build -p tweeq-slint-demo --all-targets --locked -- -D warnings
      - run: cargo test -p tweeq-slint -p tweeq-slint-build --locked
      - run: cargo check -p tweeq-slint-demo --target wasm32-unknown-unknown --locked
      - run: ./scripts/check-slint-consumer.ps1

  package:
    name: Package dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p tweeq-core --dry-run --locked
      - run: cargo package -p tweeq-egui --list --locked
