name: Deploy Tweeq galleries and API docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build egui gallery
        working-directory: crates/tweeq-demo
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: trunk build index.html --release --locked --public-url "${PAGES_BASE}/" --dist ../../site
      - name: Build Slint gallery
        working-directory: crates/tweeq-slint-demo
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: trunk build index.html --release --locked --public-url "${PAGES_BASE}/slint/" --dist ../../site/slint
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p tweeq-core -p tweeq-egui -p tweeq-slint -p tweeq-slint-build --no-deps --locked
      - name: Add API documentation to the site
        run: |
          mkdir -p site/api
          cp -R target/doc/. site/api/
          cp docs/api-index.html site/api/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
