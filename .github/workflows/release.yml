name: Publish crate

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to publish (publish tweeq-core first)
        required: true
        type: choice
        options:
          - tweeq-core
          - tweeq-egui
          - tweeq-slint-build
          - tweeq-slint
      version:
        description: Confirm the exact workspace version
        required: true
        type: string
      dry_run_only:
        description: Validate without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    if: inputs.version == '0.1.0-alpha.2'
    runs-on: ubuntu-latest
    env:
      CRATE: ${{ inputs.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy -p tweeq-core -p tweeq-egui -p tweeq-demo --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p tweeq-core -p tweeq-egui -p tweeq-demo --all-features --locked
      - run: cargo check -p tweeq-core -p tweeq-egui -p tweeq-demo --all-features --locked --target wasm32-unknown-unknown
      - run: cargo test -p tweeq-slint -p tweeq-slint-build --locked
      - name: Verify crate package contents
        run: cargo package -p "$CRATE" --list --locked

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      CRATE: ${{ inputs.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Dry-run publish
        if: inputs.dry_run_only
        run: cargo publish -p "$CRATE" --dry-run --locked
      - name: Publish crate
        if: '!inputs.dry_run_only'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p "$CRATE" --locked
