<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tweeq for Slint — interactive gallery</title>
    <link data-trunk rel="rust" data-target-name="tweeq_slint_demo_lib" href="Cargo.toml">
    <link data-trunk rel="copy-file" href="made-with-slint.svg">
    <style>
      html, body, canvas { width: 100%; height: 100%; margin: 0; }
      body { display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden; background: #171a22; }
      main { min-height: 0; overflow: hidden; }
      canvas { display: block; }
      footer { display: flex; gap: 16px; align-items: center; padding: 4px 16px; background: #fff; font: 14px system-ui, sans-serif; }
      footer img { display: block; width: 106px; height: auto; }
    </style>
  </head>
  <body>
    <main><canvas id="canvas" tabindex="0" autofocus></canvas></main>
    <footer>
      <a href="https://slint.dev/"><img src="./made-with-slint.svg" alt="Made with Slint"></a>
      <a href="../">egui gallery</a>
    </footer>
  </body>
</html>
