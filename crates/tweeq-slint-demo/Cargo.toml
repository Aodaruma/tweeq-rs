[package]
name = "tweeq-slint-demo"
description = "Interactive Windows and Web gallery for the Tweeq Slint controls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "tweeq_slint_demo_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
slint.workspace = true
tweeq-slint.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
slint = { workspace = true, features = ["unstable-winit-030"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
i-slint-backend-winit = { version = "=1.18.1", default-features = false, features = ["renderer-femtovg"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "MouseEvent", "Window"] }

[build-dependencies]
slint-build.workspace = true
tweeq-slint-build.workspace = true

[lints.rust]
# Slint's generated vtable macros locally allow their own unsafe code.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
